<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene generator · Empirical Armory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600&family=IM+Fell+English&display=swap">
<link rel="stylesheet" href="ea.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F1B16'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23E6DFCF'/%3E%3C/svg%3E">
<style>
  main { max-width: 820px; margin: 0 auto; padding: 48px 24px 72px; display: grid; gap: 28px; }
  .kicker { font: 500 16px/1.2 var(--cabin); color: var(--faded); }
  h1 { font-size: clamp(36px, 6vw, 52px); line-height: 1.05; }
  .lead { font-size: 19px; line-height: 1.5; max-width: 60ch; }
  section { display: grid; gap: 12px; }
  h2 { font-size: 28px; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 16px; }
  .facts dt { color: var(--faded); }
  .facts dd { margin: 0; }
  .models { display: grid; gap: 10px; }
  .model { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: rgba(250, 248, 243, 0.55); }
  .model .name { font-weight: 500; }
  .model .state { color: var(--faded); font-variant-numeric: tabular-nums; }
  .model.ready .state { color: var(--ink); }
  .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--ink); width: 0; transition: width 0.6s; }
  .group { font: 500 16px/1.2 var(--cabin); color: var(--faded); margin-top: 8px; }
  .note { color: var(--faded); }
  .problem { color: var(--verm); }
</style>
</head>
<body>
<main>
  <div>
    <p class="kicker">Empirical Armory</p>
    <h1>Scene generator</h1>
  </div>
  <p class="lead">Getting ready. The models download in the setup window; this page follows along and
    becomes the generator once they are here.</p>

  <section>
    <h2>This computer</h2>
    <dl class="facts" id="facts"><dt>Status</dt><dd>Checking…</dd></dl>
  </section>

  <section>
    <h2>Models</h2>
    <div class="models" id="models"></div>
  </section>
</main>
<script type="module">
  const GROUPS = { hidream: 'HiDream-O1-Image · MIT', flux3: 'FLUX 3 Image Klein · FLUX Kommunity License', qwen: 'Qwen-Image-Edit-2511 · Apache 2.0' };
  const gb = (b) => (b / 1e9).toFixed(1) + ' GB';
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  async function tick() {
    let s;
    try { s = await (await fetch('api/status', { cache: 'no-store' })).json(); }
    catch { document.getElementById('facts').innerHTML = '<dt>Status</dt><dd class="problem">The generator is not answering. Is its window still open?</dd>'; return; }
    const sys = s.system || {}, gpu = s.gpu || {}, ins = s.install || {};
    const rows = [
      ['Graphics', gpu.name ? `${gpu.name}, ${gpu.vram_gb} GB` : (sys.gpu || 'not found')],
      ['Driver', sys.driver || '—'],
      ['PyTorch', gpu.torch ? `${gpu.torch} (CUDA ${gpu.cuda || '—'})` : '—'],
      ['Memory', sys.ram_gb ? sys.ram_gb + ' GB' : '—'],
      ['Setup', ins.state === 'error' ? `<span class="problem">${esc(ins.detail)}</span>` : (ins.state === 'ok' ? 'Finished' : esc([ins.step, ins.detail].filter(Boolean).join(': ') || '—'))],
    ];
    document.getElementById('facts').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
    let html = '', last = '';
    for (const m of s.models || []) {
      if (m.group !== last) { html += `<p class="group">${esc(GROUPS[m.group] || m.group)}</p>`; last = m.group; }
      const pct = m.size ? Math.min(100, (m.downloaded / m.size) * 100) : 0;
      const state = m.ready ? 'Ready' : (m.downloaded ? `${gb(m.downloaded)} of ${gb(m.size)}` : `${gb(m.size)}, waiting`);
      html += `<div class="model${m.ready ? ' ready' : ''}"><span class="name">${esc(m.label)}${m.optional ? ' <span class="note">(optional)</span>' : ''}</span><span class="state">${state}</span><div class="bar"><span style="width:${pct.toFixed(1)}%"></span></div></div>`;
    }
    document.getElementById('models').innerHTML = html || '<p class="note">No model list found.</p>';
  }
  tick();
  setInterval(tick, 3000);
</script>
</body>
</html>
